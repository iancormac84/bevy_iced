[package]
name = "bevy_iced"
version = "0.5.0"
edition = "2024"
description = "Iced integration for Bevy"
authors = ["tasgon <me@tas.sh>"]
license = "MIT OR Apache-2.0"
keywords = ["bevy", "iced", "ui", "game", "gui"]
homepage = "https://github.com/tasgon/bevy_iced"
repository = "https://github.com/tasgon/bevy_iced"
documentation = "https://docs.rs/bevy_iced"

[features]
default = ["smol"]
tokio = ["dep:tokio", "dep:async-compat"]
smol = ["dep:async-io"]

[dependencies]
bevy_app = { git = "https://github.com/bevyengine/bevy.git" }
bevy_camera = { git = "https://github.com/bevyengine/bevy.git" }
bevy_core_pipeline = { git = "https://github.com/bevyengine/bevy.git" }
bevy_derive = { git = "https://github.com/bevyengine/bevy.git" }
bevy_ecs = { git = "https://github.com/bevyengine/bevy.git" }
bevy_input = { git = "https://github.com/bevyengine/bevy.git" }
bevy_math = { git = "https://github.com/bevyengine/bevy.git" }
bevy_render = { git = "https://github.com/bevyengine/bevy.git" }
bevy_tasks = { git = "https://github.com/bevyengine/bevy.git" }
bevy_window = { git = "https://github.com/bevyengine/bevy.git" }
bevy_winit = { git = "https://github.com/bevyengine/bevy.git" }

#iced_core = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "943d6b1a93eb73ca69365e5009bb91b281785992" }
#iced_graphics = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "943d6b1a93eb73ca69365e5009bb91b281785992" }
#iced_renderer = { git = "https://github.com/Argeo-Robotics/iced.git", features = ["wgpu"], rev = "943d6b1a93eb73ca69365e5009bb91b281785992" }
#iced_runtime = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "943d6b1a93eb73ca69365e5009bb91b281785992" }
#iced_wgpu = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "943d6b1a93eb73ca69365e5009bb91b281785992" }
#iced_widget = { git = "https://github.com/Argeo-Robotics/iced.git", rev = "943d6b1a93eb73ca69365e5009bb91b281785992" }

iced_core = { git = "https://github.com/iancormac84/iced.git", branch = "update" }
iced_graphics = { git = "https://github.com/iancormac84/iced.git", branch = "update" }
iced_renderer = { git = "https://github.com/iancormac84/iced.git", features = ["wgpu"], branch = "update" }
iced_runtime = { git = "https://github.com/iancormac84/iced.git", branch = "update" }
iced_wgpu = { git = "https://github.com/iancormac84/iced.git", branch = "update" }
iced_widget = { git = "https://github.com/iancormac84/iced.git", branch = "update" }

cfg-if = "1.0.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1.44.1", default-features = false, features = ["time"], optional = true }
async-compat = { version = "0.2.4", optional = true }
async-io = { version = "2.4.0", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
gloo-timers = { version = "0.3.0", features = ["futures"] }


[dev-dependencies]
bevy = { git = "https://github.com/bevyengine/bevy.git", default-features = false, features = [
    "async_executor",
    "bevy_core_pipeline",
    "bevy_sprite",
    "bevy_window",
    "bevy_winit",
    "multi_threaded",
    "webgpu",
    "x11"
] }
getrandom = { version = "0.3.1", features = ["wasm_js"] }
rand = "0.9"
